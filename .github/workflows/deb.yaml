name: pack from deb

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deb.yaml
      - deb/**
      - VERSION
  pull_request:
    paths:
      - .github/workflows/deb.yaml
      - deb/**
      - VERSION
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/tgiesinger/protonmail-bridge

jobs:
  deb:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./deb
          file: ./deb/Dockerfile
          load: true
          tags: protonmail-bridge:deb-test
          cache-from: type=gha,scope=deb
          cache-to: type=gha,mode=max,scope=deb

      - name: Smoke test
        run: |
          docker run --rm --entrypoint bash protonmail-bridge:deb-test -c '
            set -e
            for bin in /usr/lib/protonmail/bridge/bridge /usr/lib/protonmail/bridge/proton-bridge; do
              if ldd "$bin" | grep "not found"; then
                echo "::error::$bin is missing shared libraries"
                exit 1
              fi
            done
            /usr/lib/protonmail/bridge/bridge --version
            command -v protonmail-bridge socat pass gpg
          '

      - name: Trivy scan (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: protonmail-bridge:deb-test
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy SARIF report
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif
          category: deb

      - name: Trivy scan (fail on fixable critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: protonmail-bridge:deb-test
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Docker meta
        id: meta
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.version }}
            type=raw,value=latest

      - name: Login to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./deb
          file: ./deb/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=deb
